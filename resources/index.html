<!doctype html>
<html>
<head>
  <title>{{ .title }}</title>
  <link rel="manifest" href="manifest.json" crossorigin="use-credentials">
  <link rel="icon" href="favicon.ico">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- xterm.js styles -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css" />

  <style>
    :root { --wt-toolbar-h: 44px; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
    }
    /* Column layout: the toolbar sits at the top, #app (the regions) fills the rest. */
    body {
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
      min-height: 0;
      display: flex;
      width: 100%;
    }
    /* Each split region is a flex row: [terminal | its sidebar]. Regions tile
       across #app; a .divider sits between them. The SplitManager fills #app. */
    .region {
      flex: 1;
      min-width: 0;
      display: flex;
      position: relative;
    }
    .region-term {
      flex: 1;
      min-width: 0;
      height: 100%;
    }
    .divider {
      flex: 0 0 4px;
      background: #0f3460;
      cursor: col-resize;
    }
    /* Focus outline + divider only matter once there are 2+ regions, so a lone
       single-view region looks exactly as before. */
    #app.split-active .region.focused {
      outline: 2px solid #4a9eff;
      outline-offset: -2px;
    }
    .xterm {
      height: 100%;
      padding: 8px;
      background: #000000;
    }
  </style>

  <!-- ES Module imports -->
  <script type="importmap">
  {
    "imports": {
      "lit": "https://cdn.jsdelivr.net/npm/lit@3/+esm",
      "lit/decorators.js": "https://cdn.jsdelivr.net/npm/lit@3/decorators.js/+esm",
      "@xterm/xterm": "https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/+esm",
      "@xterm/addon-fit": "https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/+esm",
      "@xterm/addon-webgl": "https://cdn.jsdelivr.net/npm/@xterm/addon-webgl@0.18.0/+esm",
      "@xterm/addon-unicode11": "https://cdn.jsdelivr.net/npm/@xterm/addon-unicode11@0.8.0/+esm"
    }
  }
  </script>
</head>

<body class="bg-gray-900">
  <!-- The SplitManager fills #app with region(s); each region has its own
       terminal + sidebar. Single-view = one region (looks/behaves as before). -->
  <div id="app"></div>

  <!-- Mobile controls (shown on small screens) -->
  <webtmux-mobile-controls class="lg:hidden"></webtmux-mobile-controls>

  <script src="./auth_token.js"></script>
  <script src="./config.js"></script>
  <script type="module" src="./js/webtmux.js"></script>
</body>
</html>
